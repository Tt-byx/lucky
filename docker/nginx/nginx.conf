events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 100M;

    # Gzip压缩配置
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_min_length 256;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon;

    # ============================================================
    # 统一入口：所有流量从 80 进，按路径分发
    #
    #   /            → 手机端（学生扫码入口）
    #   /screen/     → 大屏    （vite base=/screen/ 构建）
    #   /admin/      → 管理后台（vite base=/admin/ 构建）
    #   /api/        → backend（REST）
    #   /ws/         → backend（WebSocket）
    #   /uploads/    → backend（OSS 降级时本地上传的背景图/视频）
    #
    # 域名 + ICP 备案完成后，在这个 server 上补 443 ssl 监听与证书即可，
    # 路径结构不变，前端无需重新构建。
    # ============================================================
    server {
        listen 80 default_server;
        server_name _;

        # ---------- 手机端：根路径 ----------

        # 手机端构建产物（资源引用 /assets/xxx），带 hash 长缓存
        # ^~ 确保不被其他正则抢先；root 指向 mobile 目录
        location ^~ /assets/ {
            root /usr/share/nginx/html/mobile;
            expires 7d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location / {
            root /usr/share/nginx/html/mobile;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # ---------- 大屏：/screen/ 子路径 ----------

        # 无斜杠访问自动补齐，否则会落到手机端的 location /
        location = /screen {
            return 301 /screen/;
        }

        # 静态资源长缓存（/screen/assets/xxx.js）
        location ^~ /screen/assets/ {
            root /usr/share/nginx/html;
            expires 7d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location ^~ /screen/ {
            root /usr/share/nginx/html;
            index index.html;
            # SPA 回退：找不到的路径都交给前端路由
            try_files $uri $uri/ /screen/index.html;
        }

        # ---------- 管理后台：/admin/ 子路径 ----------

        location = /admin {
            return 301 /admin/;
        }

        location ^~ /admin/assets/ {
            root /usr/share/nginx/html;
            expires 7d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location ^~ /admin/ {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /admin/index.html;
        }

        # ---------- 后端转发 ----------

        # 本地存储的图片/视频（OSS 不可用时的降级路径）
        # 必须用 ^~ —— 否则会被资源类正则抢先匹配去静态目录里找文件，结果 404（F-27 的教训）
        location ^~ /uploads/ {
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 后端API
        location /api/ {
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket
        # 握手是一次 HTTP 升级，Upgrade/Connection 两个头必须透传，
        # 否则升级失败、前端永远连不上；read_timeout 拉长防长连接被掐
        location /ws/ {
            proxy_pass http://backend:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }
    }
}
