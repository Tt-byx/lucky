services:
  mysql:
    build:
      context: .
      dockerfile: docker/Dockerfile.mysql
    container_name: lucky-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: lucky
      MYSQL_CHARSET: utf8mb4
    ports:
      # 宿主机 3306 已被本机 MySQL 服务占用，改映射到 3307；容器内仍为 3306，后端经内部网络直连
      - "3307:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      # 数据持久化：原编排缺失该卷，容器重建即丢库。如需重置数据执行 docker compose down -v
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: lucky-redis
    ports:
      - "6379:6379"
    # 本地也设密码：与生产形态一致（application-prod 的 ${REDIS_PASSWORD:} 落成空串时，
    # Redisson 会把空串当「已配置密码」发 AUTH，被无密码的 Redis 拒绝——不要依赖空串语义）
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "lucky-dev-redis"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: lucky-rabbitmq
    ports:
      # 宿主机 5672/15672 被本机 RabbitMQ 占用；5673-5772 属 Windows 保留区间，故用 5773/15673
      - "5773:5672"
      - "15673:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: lucky-backend
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: lucky
      DB_USERNAME: root
      DB_PASSWORD: 123456
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: lucky-dev-redis
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET}
      BASE_URL: http://101.201.233.194
    ports:
      - "8080:8080"
    volumes:
      # OSS 不可用时背景图会降级存到本地，挂个卷避免容器重建后图片全丢
      - uploads-data:/app/uploads
      # 日志文件挂载到宿主机（logback 写到 /app/logs），容器重建后日志不丢
      - logs-data:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: lucky-frontend
    ports:
      # 统一入口（与生产一致）：80 一个端口按路径分发
      #   手机端 http://localhost/          大屏 http://localhost/screen/
      #   管理端 http://localhost/admin/    API/WS/uploads 由 nginx 转发
      # 原 5173/5174/5175 三端口入口已移除，bench/e2e 脚本的 URL 已同步更新
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  # ==================== 多实例验证（profile: multinode） ====================
  # 默认不启动。验证水平扩容时用：
  #   docker compose --profile multinode up -d --build backend-a backend-b
  # 两个实例共享同一套 mysql/redis/rabbitmq，端口分别映射到 8081/8082，
  # 测试脚本直接连这两个端口，能明确区分「用户在实例 A、大屏在实例 B」。
  # 用完清理：docker compose --profile multinode down backend-a backend-b
  backend-a:
    profiles: ["multinode"]
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: lucky-backend-a
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: lucky
      DB_USERNAME: root
      DB_PASSWORD: 123456
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: lucky-dev-redis
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
    ports:
      - "8081:8080"
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  backend-b:
    profiles: ["multinode"]
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: lucky-backend-b
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: lucky
      DB_USERNAME: root
      DB_PASSWORD: 123456
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: lucky-dev-redis
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
    ports:
      - "8082:8080"
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # ==================== 监控告警（profile: monitoring） ====================
  # 默认不启动。部署监控时用：
  #   docker compose --profile monitoring up -d prometheus alertmanager
  # Prometheus UI: http://localhost:9090    Alertmanager UI: http://localhost:9093
  # 告警规则在 docker/monitoring/alert-rules.yml，改了以后访问
  # http://localhost:9090/-/reload 或重启 prometheus 生效。
  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:latest
    container_name: lucky-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
    restart: unless-stopped

  alertmanager:
    profiles: ["monitoring"]
    image: prom/alertmanager:latest
    container_name: lucky-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./docker/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
  uploads-data:
  logs-data:
  prometheus-data:
  alertmanager-data:
