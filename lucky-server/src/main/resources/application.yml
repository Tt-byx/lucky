server:
  port: 8080
  tomcat:
    threads:
      max: 500
      min-spare: 50
    accept-count: 1000
    max-connections: 10000

spring:
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  datasource:
    url: jdbc:mysql://localhost:3306/lucky?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    # HikariCP 连接池配置（高并发优化）
    hikari:
      minimum-idle: 10
      maximum-pool-size: 30
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1
  # 定时任务线程池：默认单线程会让对账任务卡住在线人数广播与连接清理
  task:
    scheduling:
      pool:
        size: 4
      thread-name-prefix: lucky-sched-
  # Redis配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 32
          max-wait: 3000ms
          max-idle: 16
          min-idle: 8
  # RabbitMQ配置（消息可靠性：Publisher Confirm + Return）
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /
    # 发布确认（确保消息到达交换机）
    publisher-confirm-type: correlated
    # 发布返回（确保消息路由到队列）
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10
        # 消费者并发数（高并发弹幕场景）
        concurrency: 4
        max-concurrency: 8
  # Sentinel配置
  cloud:
    sentinel:
      enabled: true
      eager: true
      transport:
        dashboard: ${SENTINEL_DASHBOARD:}
        port: 8719

# Redisson配置
redisson:
  single-server-config:
    address: redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# 监控与指标
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: lucky-server

# 活动配置
lucky:
  base-url: http://172.27.59.47:5176
  # 弹幕限流配置
  danmaku:
    # 单用户每秒最大弹幕数
    max-per-second: 1
    # 批量推送阈值
    batch-threshold: 50
    # 批量推送刷新间隔（毫秒）
    batch-flush-interval: 50
  # 扫码登录配置
  scan-login:
    # 令牌有效期（秒）
    token-expire-seconds: 7200
    # 单IP 60秒内最大登录次数
    max-login-per-60s: 10
  # 抽奖配置
  lottery:
    # 单用户单活动最大中奖次数
    max-wins-per-user: 1
    # 分布式锁等待时间（秒）
    lock-wait-seconds: 3
    # 分布式锁持有时间（秒）
    lock-lease-seconds: 30

# 阿里云 OSS 配置
alibaba:
  oss:
    endpoint: oss-cn-beijing.aliyuncs.com
    bucket-name: ttbyx
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}

# 异步线程池配置
async:
  core-pool-size: 10
  max-pool-size: 50
  queue-capacity: 1000
