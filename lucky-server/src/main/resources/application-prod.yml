# ========================
# 生产环境配置
# ========================

server:
  # 后端服务端口（Docker 容器内部端口，一般不需要修改）
  port: 8080
  tomcat:
    threads:
      # 秒杀场景下 Tomcat 默认 200 线程会成为瓶颈，并发点击时会大量排队
      max: 500
      min-spare: 50
    accept-count: 1000
    max-connections: 10000

spring:
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  datasource:
    # ========================
    # 数据库连接配置
    # ========================
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:lucky}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 连接池：生产配置原先漏了这一整段，会直接落到 Hikari 默认的 10 个连接。
    # 抢奖主链路走 Redis 不占 DB，但 MQ 落库、管理端查询、定时任务共用这一个池。
    # connection-timeout 压到 3 秒：秒杀场景下「快速失败」远好过把线程拖在等连接上。
    hikari:
      pool-name: LuckyHikari
      minimum-idle: 10
      maximum-pool-size: 30
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
  # 定时任务线程池：默认只有 1 个调度线程，
  # 对账任务扫全表时会卡住在线人数广播（每 2 秒）和僵尸连接清理（每 30 秒）。
  task:
    scheduling:
      pool:
        size: 4
      thread-name-prefix: lucky-sched-
  # Redis配置
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          # 初版 max-active=8。连接数小于并发请求数时，Lettuce 会让请求排队等连接，
          # 这块配置按「峰值并发 / 4」估算，64 对应约 250 并发在途请求。
          # 注意：本机压测时客户端先成为瓶颈，没能量化出这块的收益，配置本身是合理的。
          max-active: 64
          max-idle: 32
          min-idle: 8
          max-wait: 3000ms
  # RabbitMQ配置
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: guest
    password: guest
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10
        concurrency: 4
        max-concurrency: 8
  # Sentinel配置
  cloud:
    sentinel:
      enabled: true
      eager: true
      transport:
        dashboard: ${SENTINEL_DASHBOARD:}
        port: 8719

# Redisson配置（Docker 环境 Redis 无密码，不配置 password）
redisson:
  single-server-config:
    address: redis://${REDIS_HOST:redis}:${REDIS_PORT:6379}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

# 监控与指标
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: lucky-server

# 活动配置
lucky:
  base-url: ${BASE_URL:http://localhost}

# 阿里云 OSS 配置（可选）
alibaba:
  oss:
    endpoint: oss-cn-beijing.aliyuncs.com
    bucket-name: ttbyx
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
