name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  backend:
    name: 后端单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 运行单元测试
        run: mvn -B -f lucky-server/pom.xml test

  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [ lucky-screen, lucky-mobile, lucky-admin ]
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 构建 ${{ matrix.app }}
        run: |
          cd ${{ matrix.app }}
          npm install
          npm run build
